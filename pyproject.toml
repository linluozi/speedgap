[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speedgap"
version = "1.0.0"
description = "Measure whether a synthetic-input speedup survives on held-out real inputs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["benchmark", "performance", "optimization", "reproducibility"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
speedgap = "speedgap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
